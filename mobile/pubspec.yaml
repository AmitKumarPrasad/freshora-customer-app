name: talegaon_fresh
description: FRESHORA customer mobile app.
publish_to: "none"
version: 0.1.3+6

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: 4.0.0
  flutter_map: 7.0.2
  latlong2: 0.9.1
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/

